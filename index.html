<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="app" class="p-5 ">
        <form id="formData" class="grid">
            <div class="form-group">
                <label for="taskName">Task Name</label>
                <input type="text" name="taskName" id="taskName"
                    class="border border-gray-200 rounded py-1 px-2 rounded-lg" placeholder="Task Name">
            </div>
            <div class="form-group">
                <select id="state" name="state"
                    class="col-start-1 row-start-1 w-100 border border-gray-200 rounded-md sm:text-sm/6">
                    <option value="" selected>Select one</option>
                    <option value="completed">Completed</option>
                    <option value="todo">ToDo</option>
                </select>
            </div>
            <textarea name="description" id="description" class="w-full border border-gray-200 p-3" rows="3"></textarea>
            <button class="px-3 py-1 bg-indigo-200 hover:bg-indigo-400 rounded" id="addBtn">Add</button>
        </form>
    </div>
    <div id="data-container" class="grid grid-cols-4 bg-zinc-100 h-full w-full p-3 space-x-3 gap-4">
        
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
